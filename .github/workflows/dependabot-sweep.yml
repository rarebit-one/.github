name: Dependabot sweep

# Org-level, single-pass auto-lander that COMPLEMENTS the per-PR
# dependabot-auto-merge.yml. The per-PR workflow approves minor/patch bumps and
# arms GitHub native auto-merge (which lands a CLEAN PR for free). This sweep
# only mops up the tail native auto-merge can't: PRs that fall BEHIND on
# strict-protected repos (native auto-merge never updates a branch). One cron for
# the whole org — not a per-repo workflow — to keep Actions minutes down.
#
# Phase 1 merges ready (CLEAN, already-approved) dependabot PRs; Phase 2 rebases
# exactly ONE behind PR per repo per pass (O(N) CI, not the O(N^2) you get from
# rebasing the whole stack). Majors are skipped (the per-PR gate never approves
# them, and this only acts on APPROVED PRs). See scripts/dependabot-sweep.sh.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6h — drains BEHIND stragglers ~4x/day
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log decisions without merging/rebasing'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dependabot-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read   # job token only checks out this repo; merges/rebases use the minted App token
    steps:
      - name: Mint app token (contents + PRs write across the org)
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: rarebit-one
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout (sweep script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Sweep
        id: sweep
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: rarebit-one
          # schedule has no inputs → live; dispatch honours the dry-run toggle.
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
          NARRATION_FILE: ${{ runner.temp }}/sweep-narration.txt
        run: bash .github/scripts/dependabot-sweep.sh

      # ----- run summary -----
      #
      # The sweep's digest (what merged, what was rebased, the human-gated
      # backlog) goes to the run summary. It used to be narrated to Slack; that
      # was retired on 2026-11-26 because the org's HQ dashboard lists the
      # release and dependency PRs waiting on a human.
      - name: Record digest in run summary
        if: ${{ always() }}
        env:
          NARRATION_FILE: ${{ runner.temp }}/sweep-narration.txt
          MERGED: ${{ steps.sweep.outputs.merged_count }}
          REBASED: ${{ steps.sweep.outputs.rebased_count }}
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          {
            printf '### Dependabot sweep: merged %s, rebased %s' "${MERGED:-0}" "${REBASED:-0}"
            [ "${DRY_RUN:-false}" = "true" ] && printf ' (dry-run, nothing changed)'
            printf '\n\n'
            # The digest uses Slack-style <url|label> links; render them as markdown.
            if [ -s "${NARRATION_FILE}" ]; then
              sed -E 's/<([^|>]+)\|([^>]+)>/[\2](\1)/g' "${NARRATION_FILE}"
            else
              echo "(no digest written)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  alert:
    needs: [sweep]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Runaway-hang cap. A single gh issue list/create/close notify step; finishes in
    # seconds. 5 replaces the implicit 360-min (6h) default.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Flag failure or clear on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout, so pin the repo for gh
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          SUCCEEDED: ${{ contains(needs.*.result, 'success') }}
        run: |
          set -euo pipefail
          WF="dependabot-sweep"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # NB: this repo has ISSUES DISABLED, so every `gh issue` call here errors. The
          # issue bookkeeping is therefore BEST-EFFORT (guarded with `|| true`) — otherwise
          # `set -e` aborts this step on the very first `gh issue list` and a GREEN run
          # shows red. On a real failure we still emit a ::warning:: so it is visible in
          # the run; the tracking issue starts working if/when issues are re-enabled.
          EXISTING="$(gh issue list --search "\"beat failure: ${WF}\" in:title" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ "${FAILED}" != "true" ]; then
            # Nothing failed. Close any open failure issue only on a run that ACTUALLY
            # succeeded — an all-skipped run is not evidence of recovery.
            if [ "${SUCCEEDED}" = "true" ] && [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Recovered: ${WF} succeeded — ${RUN_URL}." 2>/dev/null || true
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: ${RUN_URL}" 2>/dev/null || true
          else
            gh issue create \
              --title "beat failure: ${WF} ($(date -u +%F))" \
              --body "The \`${WF}\` beat failed before it could report — see ${RUN_URL}" \
              2>/dev/null \
              || echo "::warning::${WF} FAILED and issues are unavailable on this repo — see ${RUN_URL}"
          fi
