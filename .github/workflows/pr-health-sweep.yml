name: PR-health sweep

# Org-level companion to dependabot-sweep.yml, for the PRs that workflow cannot
# see. dependabot-sweep gates on `--author app/dependabot` and rebases via a
# `@dependabot rebase` comment; human- and agent-authored PRs hit the same two
# walls with nothing behind them:
#
#   1. Native auto-merge NEVER updates a branch, so on a strict "branches must be
#      up to date" repo an ARMED PR that falls BEHIND stalls forever — green,
#      mergeable, going nowhere.
#   2. A head commit can end up with NO check-runs at all, so the PR shows the
#      PREVIOUS commit's red X and nothing pending. One such fix sat correct and
#      invisible for six days in sidekick-labs, where this workflow originated.
#
# One cron for the whole org — not a per-repo workflow — to keep Actions minutes
# down, matching dependabot-sweep.yml's design. See scripts/pr-health-sweep.sh
# for the full rationale and the one-update-per-repo-per-pass pacing.
#
# This workflow never merges. Phase 1 hands a PR back to native auto-merge, which
# lands it once CI is green; Phases 2 and 3 are report-only.

on:
  schedule:
    - cron: '45 */6 * * *'   # offset 45min from dependabot-sweep (0 */6) so the two never race; :45 also dodges gem-release-tag (:17 hourly) and codeql-actions (Mon 06:30)
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log decisions without updating any branch'
        type: boolean
        default: false
      stale-draft-days:
        description: 'Days a draft may sit untouched before it is reported'
        type: string
        default: '5'

permissions: {}

concurrency:
  group: pr-health-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep PR health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read   # job token only checks out this repo; updates use the minted App token
    steps:
      - name: Mint app token (contents + PRs write across the org)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: rarebit-one
          permission-contents: write
          permission-pull-requests: write
          # actions:read is REQUIRED, not optional. `repo_runs_ci` calls
          # repos/{repo}/actions/workflows to tell "this repo has no CI" apart
          # from "this repo's CI did not run". Without it that call 403s, the
          # count reads 0, every repo looks CI-less, and Phase 2 reports nothing
          # forever — the first live run in sidekick-labs did exactly that.
          permission-actions: read

      - name: Checkout (sweep script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Sweep
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: rarebit-one
          # schedule has no inputs → live; dispatch honours the dry-run toggle.
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
          STALE_DRAFT_DAYS: ${{ inputs.stale-draft-days || '5' }}
        run: bash .github/scripts/pr-health-sweep.sh

  alert:
    needs: [sweep]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Runaway-hang cap. A single gh issue list/create/close notify step; finishes in
    # seconds. 5 replaces the implicit 360-min (6h) default.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Flag failure or clear on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout, so pin the repo for gh
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          SUCCEEDED: ${{ contains(needs.*.result, 'success') }}
        run: |
          set -euo pipefail
          WF="pr-health-sweep"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # NB: this repo has ISSUES DISABLED, so every `gh issue` call here errors. The
          # issue bookkeeping is therefore BEST-EFFORT (guarded with `|| true`) — otherwise
          # `set -e` aborts this step on the very first `gh issue list` and a GREEN run
          # shows red. On a real failure we still emit a ::warning:: so it is visible in
          # the run; the tracking issue starts working if/when issues are re-enabled.
          EXISTING="$(gh issue list --search "\"beat failure: ${WF}\" in:title" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ "${FAILED}" != "true" ]; then
            # Nothing failed. Close any open failure issue only on a run that ACTUALLY
            # succeeded — an all-skipped run is not evidence of recovery.
            if [ "${SUCCEEDED}" = "true" ] && [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Recovered: ${WF} succeeded — ${RUN_URL}." 2>/dev/null || true
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: ${RUN_URL}" 2>/dev/null || true
          else
            gh issue create \
              --title "beat failure: ${WF} ($(date -u +%F))" \
              --body "The \`${WF}\` beat failed before it could report — see ${RUN_URL}" \
              2>/dev/null \
              || echo "::warning::${WF} FAILED and issues are unavailable on this repo — see ${RUN_URL}"
          fi
