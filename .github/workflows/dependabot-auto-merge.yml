name: Auto-lander (Dependabot + autonomous engine + maintainer PRs)

# Org-shared reusable auto-lander. A thin per-repo caller
# (dependabot-auto-merge.yml, `on: pull_request_target`) invokes this so the
# logic lives in one place — mirrors the claude-code-review reusable+caller
# pattern. It lands three classes of PR by enabling squash auto-merge (GitHub
# merges once the repo's required checks go green):
#
#   1. Dependabot PRs — read the semver update-type via fetch-metadata, then
#      enable auto-merge for patch + minor. Major bumps are left for a human.
#      Exception: GROUPED github_actions updates land regardless of the
#      aggregate update-type. fetch-metadata emits a single update-type across a
#      group, and any member that isn't semver-resolvable — a same-version SHA
#      re-pin, or a reusable-workflow pin with no version tag — forces that
#      aggregate to semver-major. Because this org SHA-pins every action AND
#      groups them, the strict gate skipped essentially every github_actions PR.
#      These are vetted by the pin gate + CodeQL(Actions) + CI, so they land.
#   2. Autonomous SRE engine PRs — branches prefixed issue-worker/, ci-fix/, or
#      sentry-autofix/, opened by the SRE engine workflows. These are already
#      vetted by the engine's own guardrails before opening, so they get
#      auto-merge enabled directly (no semver gate).
#   3. Maintainer PRs — opened AND triggered by `jaryl`, not a draft. Auto-merge
#      only; no auto-approve, since a self-approval is meaningless (and the API
#      rejects it). See the job-level note for why the actor gate is the whole
#      gate here, and for the sharp edge on repos with no required checks.
#
# Safety: the caller fires on pull_request_target (writable token), but this
# workflow checks out no PR code and runs no PR bundle — it only reads metadata
# and calls the gh API. The only privileged action is "approve + enable
# auto-merge", which still defers the actual merge to the required-checks gate.
#
# ---------------------------------------------------------------------------
# WHY THE MERGE NEEDS A NON-AMBIENT TOKEN
# ---------------------------------------------------------------------------
# GitHub deliberately does NOT emit workflow-triggering events for actions
# performed with the automatic `GITHUB_TOKEN` — the documented loop-prevention
# rule. Native auto-merge is attributed to whoever ENABLED it, so an enable done
# with `GITHUB_TOKEN` produces a merge commit authored by `github-actions[bot]`
# that fires NO `push` event and therefore no `workflow_run` chain off it.
#
# Verified empirically on nutripod-web: the auto-landed Dependabot merge
# c99c3084 (main, 2026-07-27) has FOUR workflow runs, none of them `push` or
# `workflow_run`; the human-merged commits either side of it (dc76fc33,
# 34824fb2) both have `push` AND `workflow_run` runs. Same repo, same branch,
# same workflows — the only difference is who performed the merge.
#
# That silently skips every downstream chain in this org: `deploy.yml`
# (`workflow_run` off main CI) and `sentry-release.yml` (`push: main`) across
# the five app/static repos. It was already true for Dependabot; PR #78, which
# extended this lander to the maintainer's own PRs, made it materially worse
# because those are the PRs carrying app code that actually needs deploying.
#
# ---------------------------------------------------------------------------
# WHY AN APP TOKEN AND NOT A PAT
# ---------------------------------------------------------------------------
# #79 shipped the fix as `secrets.AUTOLAND_PAT` — and it never worked, because
# the secret was never created. The lander fell through to `GITHUB_TOKEN` in all
# 20 consumer repos for the entire window, announcing it into job logs nobody
# reads. jumpdrive-web#566 has the forensics: 17 consecutive main commits there
# with zero `push` runs, which also broke the release gate (the promote reusable
# looks for a CI run on the promoted SHA and found none).
#
# The lesson is not "remember to mint the PAT". It is that a fix gated on a
# human creating a credential out-of-band is a fix that reliably does not ship.
#
# A GitHub App installation access token clears the loop-prevention rule exactly
# as a PAT does — it is GitHub's other documented answer for "trigger a workflow
# from a workflow" — and this org already has the App:
#
#   * App `rarebit-one` (id 3896724), installed on ALL repositories, holding
#     `contents: write` + `pull_requests: write` — precisely the enable's needs
#   * `RELEASE_BOT_CLIENT_ID`   — org VARIABLE, visibility "All repositories"
#   * `RELEASE_BOT_PRIVATE_KEY` — org SECRET,   visibility "All repositories"
#
# So the App path needs no new credential, has no expiry to forget, is not
# attributed to a person, and is revocable independently of anyone's account.
# It is strictly better than the PAT on every axis that made the PAT fragile.
#
# READS and the Dependabot approval still use `GITHUB_TOKEN` — the elevated
# token is used ONLY for the `gh pr merge --auto` enable.
#
# ---------------------------------------------------------------------------
# TOKEN PRECEDENCE — App → AUTOLAND_PAT → GITHUB_TOKEN
# ---------------------------------------------------------------------------
# `AUTOLAND_PAT` is retained as the middle rung, not deleted: rarebit-static-v3
# holds a repo-level one, and a repo secret is not overridden by an org secret
# of the same name. Keeping the rung means that repo (and any future one where
# the App is uninstalled) still lands merges that fire push events.
#
# The final fallback to `GITHUB_TOKEN` degrades LOUDLY — a `::warning::` plus a
# job-summary block naming the workflows that will not fire — because a silent
# fallback is the exact bug this comment exists to describe, and is how the #79
# fix stayed inert for so long. The token-mode row in the decision summary at
# the bottom of this job records which rung was used on EVERY run.
#
# Callers must pass `secrets: inherit`, or `RELEASE_BOT_PRIVATE_KEY` is not
# reachable here and the App rung silently drops to the next one.

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          Label of the runner to execute on. Defaults to ubuntu-latest, which is
          REQUIRED for public callers: the estate's self-hosted runner groups
          carry `allows_public_repositories: false`, so a public repo pointed at
          one has its job refused and it queues forever with nothing red. Private
          callers pass their homelab label (e.g. `hyperion`).
        type: string
        default: 'ubuntu-latest'
      maintainer-review-check:
        description: >-
          Name of the code-review check that must have CONCLUDED before the
          maintainer path enables auto-merge. See the MAINTAINER PATH note on
          the `auto-merge` job: the actor gate authenticates who pushed, not
          who wrote the diff, so the review concluding is what actually
          distinguishes a reviewed PR from an unreviewed one. Set to an empty
          string ONLY on a repo that runs no code review at all — that restores
          the old fail-open behaviour and is reported as such in the summary.
        type: string
        default: 'Claude Code Review'
      maintainer-review-timeout-seconds:
        description: >-
          How long to wait for that check to conclude before giving up and
          leaving the PR for a human. Not a merge delay — auto-merge still waits
          on required checks afterwards; this only bounds the wait for the
          review VERDICT.
        type: number
        default: 600

jobs:
  auto-merge:
    # Act on Dependabot's own PRs and on autonomous SRE engine PRs. The engine
    # path is gated on BOTH the release-bot App actor AND the head-ref prefix:
    # the actor gate closes a branch-name spoofing hole — otherwise anyone able
    # to push a `ci-fix/*` (etc.) branch would get native auto-merge enabled on
    # their PR (landing on required-checks-green with no human review). Only the
    # release-bot App opens genuine engine PRs, so require its login too.
    #
    # The maintainer path deliberately carries NO branch-prefix gate. The prefix
    # exists on the engine path only because `rarebit-one[bot]` is a shared
    # identity that opens plenty of PRs which are not engine output, so the
    # prefix narrows the App down to the vetted subset. A human login is not a
    # shared identity: `github.actor` is stamped by GitHub from the
    # authenticated actor, is not settable from the PR, and cannot be reached by
    # a fork or by anyone able to push a branch.
    #
    # CORRECTED 2026-08-24 — this block used to conclude from that: "so
    # actor == 'jaryl' already means 'the maintainer did this', and a branch
    # convention on top would be decoration, not security." The premise is
    # sound and the conclusion does not follow. `github.actor` is a fact about
    # AUTHENTICATION — who pushed — and the thing being inferred from it is
    # AUTHORSHIP: who wrote the diff and whether a human read it. An agent
    # session runs under the maintainer's own credentials, so it satisfies
    # every condition here while nobody has read the code.
    #
    # That is not hypothetical. On 2026-08-24 this path auto-merged FOUR
    # `rarebit-sre` PRs (#309, #313, #314, #315) with zero human approvals, a
    # median of 32 seconds from open to merge, each one landing 1m34s–3m21s
    # BEFORE its own review concluded — the reviewer's comments on #309 and
    # #315 open with "This PR is already merged, so the following is
    # retrospective feedback for follow-up, not a merge gate." #313 merged
    # 3m21s ahead of a review flagging a comment that contradicted its own
    # code, and was reverted four hours later by #314 for not building.
    #
    # Every identity-shaped fix for this fails OPEN, which is why none is used
    # here. Measured on the same day: `Co-Authored-By: Claude` appears on 20 of
    # 60 recent `rarebit-sre` commits and on ZERO of the four that merged, all
    # of which read author == committer == the maintainer, verified, no
    # trailer. A trailer rule, a committer-vs-author rule and a branch-prefix
    # rule would each have merged all four identically.
    #
    # So the gate is not on identity at all: the maintainer path now requires
    # the code-review check to have CONCLUDED, and to have concluded cleanly.
    # That is a fact about whether the PR was reviewed, which is the property
    # actually wanted, and it is unforgeable by anything the author controls.
    # See the `maintainer_review_gate` step.
    #
    # Two conditions ARE added on top of the actor:
    #   * `pull_request.user.login == 'jaryl'` — on a `synchronize` event the
    #     actor is whoever pushed, so a maintainer push to somebody else's PR
    #     branch would otherwise enable auto-merge on a PR he did not author.
    #     Requiring author AND actor keeps the endorsement explicit.
    #   * `draft == false` — a draft is an explicit "not ready"; auto-merge on
    #     one would land it the moment it is marked ready and checks are green.
    #     Callers opting into this path should add `ready_for_review` to their
    #     `pull_request_target` `types:` — the default set is opened/
    #     synchronize/reopened, so a draft marked ready with no further push
    #     would never re-trigger and would sit unarmed until the next commit.
    #
    # SHARP EDGE — read before enabling this on a new repo: auto-merge is only
    # as strong as the repo's REQUIRED checks. Most repos in this org are not
    # branch-protected (workspace CLAUDE.md Rule #7: "the checks that actually
    # ran are the gate" — that convention is about a human judging a PR, and
    # native auto-merge does not implement it). On a repo with zero required
    # checks there is nothing left to wait for, so "auto-merge" means merge on
    # open. Callers that opt into the maintainer path should have branch
    # protection with at least the CI check required.
    if: >-
      github.actor == 'dependabot[bot]' ||
      (github.actor == 'rarebit-one[bot]' && (
        startsWith(github.event.pull_request.head.ref, 'issue-worker/') ||
        startsWith(github.event.pull_request.head.ref, 'ci-fix/') ||
        startsWith(github.event.pull_request.head.ref, 'sentry-autofix/'))) ||
      (github.actor == 'jaryl' &&
        github.event.pull_request.user.login == 'jaryl' &&
        github.event.pull_request.draft == false)
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint a release-bot App token for the merge
        id: app_token
        # `continue-on-error` is load-bearing, not defensive dressing: this
        # action FAILS the step when the client-id or private key is missing or
        # the App is not installed on the calling repo. Without it, one repo
        # outside the App's installation would take the whole lander down for
        # that PR — turning a graceful drop to the next token rung into an
        # outage. On failure `steps.app_token.outputs.token` is empty, which is
        # exactly what the precedence chain below reads.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `client-id:`, not `app-id:` — RELEASE_BOT_CLIENT_ID holds the App's
          # Client ID (Iv23li…), not its numeric App ID (3896724), and this is
          # what every other call site of this action in this repo uses
          # (gem-release-tag, gem-release-prep, dependabot-sweep, pin-sweep,
          # weekly-actions-audit).
          #
          # Not a latent bug either way: v3.2.0's `app-id` input also accepts a
          # Client ID, and jumpdrive-web's sync-rbis job proves it empirically —
          # same action SHA, same variable, passed as `app-id:`, mints fine. So
          # this is naming hygiene, not a fix. Worth being deliberate about
          # regardless: the mint is `continue-on-error`, so ANY future failure
          # here drops silently to the GITHUB_TOKEN rung and the lander goes
          # back to landing merges that fire no push event. The job summary's
          # token row is what makes that visible — read it, don't assume.
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Scoped to exactly what `gh pr merge --auto` needs. The App holds
          # more (issues, workflows); an installation token is capped down to
          # what is requested here, so the enable cannot reach beyond merging.
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve the merge token (App → AUTOLAND_PAT → GITHUB_TOKEN)
        id: token
        # Runs unconditionally so the decision is recorded on every path,
        # including the ones that end up enabling nothing. `secrets` is only
        # readable from step-level `env:`/`with:` (never a job `if:`), and each
        # comparison yields a plain "true"/"false" — no token is ever
        # interpolated here, so nothing lands in the log.
        env:
          HAS_APP: ${{ steps.app_token.outputs.token != '' }}
          HAS_PAT: ${{ secrets.AUTOLAND_PAT != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_APP" = "true" ]; then
            echo "mode=release-bot App" >> "$GITHUB_OUTPUT"
            {
              echo "### Auto-lander merge token"
              echo ""
              echo "✅ Using the \`rarebit-one\` **App installation token** — the merge is attributed to the App, not the ambient token, so downstream \`push\` / \`workflow_run\` workflows (deploy, sentry-release) WILL fire."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "mode=AUTOLAND_PAT" >> "$GITHUB_OUTPUT"
            {
              echo "### Auto-lander merge token"
              echo ""
              echo "✅ Using \`AUTOLAND_PAT\` — the merge will be attributed to a real user, so downstream \`push\` / \`workflow_run\` workflows (deploy, sentry-release) WILL fire."
              echo ""
              echo "_Note: the App token was not available here. That is expected only on repos outside the \`rarebit-one\` App installation._"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=GITHUB_TOKEN (degraded)" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither the release-bot App token nor AUTOLAND_PAT is available to this repo — falling back to GITHUB_TOKEN. GitHub does not emit workflow-triggering events for GITHUB_TOKEN actions, so the resulting merge will fire NO push event: deploy.yml (workflow_run) and sentry-release.yml (push: main) will NOT run for this merge. Check that the caller passes 'secrets: inherit' and that the rarebit-one App is installed on this repo."
            {
              echo "### Auto-lander merge token"
              echo ""
              echo "⚠️ **Degraded — no App token and no \`AUTOLAND_PAT\`; falling back to \`GITHUB_TOKEN\`.**"
              echo ""
              echo "The merge will be attributed to \`github-actions[bot]\` and will emit **no \`push\` event**."
              echo "Downstream \`push\`-triggered and \`workflow_run\`-chained workflows (e.g. \`deploy.yml\`, \`sentry-release.yml\`) **will not fire** for this merge."
              echo ""
              echo "Check, in order:"
              echo "1. the caller passes \`secrets: inherit\` (without it \`RELEASE_BOT_PRIVATE_KEY\` never reaches this workflow);"
              echo "2. the \`rarebit-one\` App is installed on this repository;"
              echo "3. \`RELEASE_BOT_CLIENT_ID\` (org variable) and \`RELEASE_BOT_PRIVATE_KEY\` (org secret) are both visible to it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch Dependabot metadata
        id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and enable auto-merge for patch/minor
        id: dependabot_enable
        # Patch/minor always land. Additionally, a GROUPED github_actions update
        # lands whatever its aggregate update-type says — see the header note:
        # SHA-pinned group members make that aggregate meaningless (it reads
        # semver-major even when every bump is a patch). Non-grouped updates and
        # every other ecosystem keep the strict gate, so a bundler/npm major
        # still waits for a human.
        if: >-
          github.actor == 'dependabot[bot]' && (
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' || (
          steps.metadata.outputs.package-ecosystem == 'github_actions' &&
          steps.metadata.outputs.dependency-group != ''))
        env:
          # Reads + the approval keep the ambient token. The approval is
          # deliberately NOT moved to the elevated token: it would turn every
          # Dependabot bump into an approval attributed to the App (or, with a
          # PAT, to the maintainer personally), which is a governance change,
          # not a push-event fix.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The ENABLE — and only the enable — uses the elevated token, so the
          # eventual merge is attributed to a non-ambient identity and emits a
          # push event. See the TOKEN PRECEDENCE note in the header.
          MERGE_TOKEN: ${{ steps.app_token.outputs.token || secrets.AUTOLAND_PAT || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr review --approve "$PR_URL" || true
          GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash "$PR_URL" || echo "::warning::gh pr merge --auto failed for $PR_URL"

          # Read the enable back. `gh pr merge --auto` can report success while
          # queueing nothing, which is exactly how this workflow sat green for
          # days having landed nothing — fail loudly instead. MERGED counts as
          # success: when every requirement is already green GitHub merges
          # outright and leaves no pending autoMergeRequest, so a null there
          # means "already landed", not "enable failed". `set -e` above makes a
          # flaky `gh pr view` abort rather than read as queued.
          verdict=$(gh pr view "$PR_URL" --json autoMergeRequest,state \
            --jq 'if .state == "MERGED" or .autoMergeRequest != null then "ok" else "not-queued" end')
          if [ "$verdict" != "ok" ]; then
            echo "::error::auto-merge was NOT queued on $PR_URL (autoMergeRequest null and state is not MERGED)"
            exit 1
          fi
          echo "auto-merge queued (or already merged) on $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-merge — autonomous SRE engine PR
        id: engine_enable
        # Actor-gated (not just `!= dependabot[bot]`) so a spoofed engine-prefix
        # branch from any other actor can't reach this step.
        if: github.actor == 'rarebit-one[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ steps.app_token.outputs.token || secrets.AUTOLAND_PAT || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Engine PRs (issue-worker/*, ci-fix/*, sentry-autofix/*) are already
          # vetted by the engine's own guardrails (path guards, diff-line cap,
          # test gate, signed commit) before opening — so just enable squash
          # auto-merge and let the repo's required-checks gate do the rest, the
          # same as Dependabot.
          set -euo pipefail
          GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash "$PR_URL" || echo "::warning::gh pr merge --auto failed for $PR_URL"

          # Same readback as the Dependabot path. Without it this step keeps the
          # exact silent-success bug this workflow exists to close: a `|| echo`
          # swallows the failure, the step's outcome is still `success` (not
          # `skipped`), so the reporter below never flags it either.
          verdict=$(gh pr view "$PR_URL" --json autoMergeRequest,state \
            --jq 'if .state == "MERGED" or .autoMergeRequest != null then "ok" else "not-queued" end')
          if [ "$verdict" != "ok" ]; then
            echo "::error::auto-merge was NOT queued on $PR_URL (autoMergeRequest null and state is not MERGED)"
            exit 1
          fi
          echo "auto-merge queued (or already merged) on $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Require the review to have concluded — maintainer PR
        id: maintainer_review_gate
        if: github.actor == 'jaryl'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: ${{ inputs.maintainer-review-check }}
          TIMEOUT_S: ${{ inputs.maintainer-review-timeout-seconds }}
        run: |
          # THREE outcomes, not two. The defect this closes was a gate with
          # only "merge" and "don't merge", where "the review has not answered
          # yet" was indistinguishable from "the review was fine" — so the
          # absence of a verdict read as a pass. Per
          # `.claude/conventions/check-positive-controls.md`, a check that has
          # not returned is UNVERIFIED, never negative.
          #
          #   clean    → the review concluded and did not fail  → enable
          #   failed   → the review concluded and failed        → do not enable
          #   unknown  → absent, timed out, or unreadable       → do not enable
          #
          # `unknown` deliberately does NOT fail the job. A PR that needs a
          # human to press merge is a normal outcome, not a broken pipeline;
          # failing here would redden every such PR and train people to ignore
          # it. It is reported loudly in the step summary instead, which is the
          # thing that makes "nothing was enabled" legible.
          set -euo pipefail

          if [ -z "$CHECK_NAME" ]; then
            echo "verdict=clean" >> "$GITHUB_OUTPUT"
            echo "detail=review gate disabled by caller (maintainer-review-check is empty)" >> "$GITHUB_OUTPUT"
            echo "::warning::Maintainer review gate is DISABLED on $REPO — auto-merge will land this PR without any review having concluded."
            exit 0
          fi

          deadline=$(( $(date +%s) + TIMEOUT_S ))
          verdict=unknown
          detail="no check named '$CHECK_NAME' appeared for $HEAD_SHA"

          while :; do
            # `|| true` on the read, then an explicit empty-check: an API blip
            # must land in `unknown`, never in a silent pass.
            runs=$(gh api "/repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
                     --jq '.check_runs[] | select(.name == env.CHECK_NAME) | "\(.status)\t\(.conclusion // "-")"' 2>/dev/null || true)

            if [ -n "$runs" ]; then
              # Take the most conservative reading across matching runs: any
              # still-running instance means we do not have a verdict yet.
              if printf '%s\n' "$runs" | grep -qv '^completed'; then
                : # still in flight — keep waiting
              else
                if printf '%s\n' "$runs" | grep -qE '^completed\t(failure|timed_out|cancelled|action_required)$'; then
                  verdict=failed
                  detail="'$CHECK_NAME' concluded $(printf '%s\n' "$runs" | head -1 | cut -f2)"
                else
                  verdict=clean
                  detail="'$CHECK_NAME' concluded $(printf '%s\n' "$runs" | head -1 | cut -f2)"
                fi
                break
              fi
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              if [ -n "$runs" ]; then
                detail="'$CHECK_NAME' was still running after ${TIMEOUT_S}s"
              fi
              break
            fi
            sleep 15
          done

          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

          case "$verdict" in
            clean)
              echo "✅ Review gate: $detail — proceeding to enable auto-merge." >> "$GITHUB_STEP_SUMMARY" ;;
            failed)
              echo "::warning::Not enabling auto-merge — $detail"
              echo "🛑 **Review gate: $detail.** Auto-merge was NOT enabled; fix the review findings, or merge by hand if you disagree with them." >> "$GITHUB_STEP_SUMMARY" ;;
            unknown)
              echo "::warning::Not enabling auto-merge — $detail. This is UNKNOWN, not clean."
              {
                echo "⚠️ **Review gate: UNKNOWN — $detail.**"
                echo ""
                echo "Auto-merge was **not** enabled. This is deliberate: an absent or unfinished review is not evidence of a clean one."
                echo ""
                echo "If this repo genuinely runs no code review, the caller should pass \`maintainer-review-check: ''\` explicitly rather than letting every maintainer PR land here."
              } >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Enable auto-merge — maintainer PR
        id: maintainer_enable
        # The job-level `if` already required actor == author == 'jaryl' and
        # not-a-draft; this narrows the step to that path, and additionally
        # requires the review to have CONCLUDED CLEANLY (see the step above and
        # the MAINTAINER PATH note on the job).
        if: github.actor == 'jaryl' && steps.maintainer_review_gate.outputs.verdict == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ steps.app_token.outputs.token || secrets.AUTOLAND_PAT || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # NOTE: no `gh pr review --approve` here, unlike the Dependabot path.
          # GitHub rejects approving your own PR, and a self-approval would be
          # worthless as a signal even if it were allowed. Auto-merge only.
          set -euo pipefail
          GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash "$PR_URL" || echo "::warning::gh pr merge --auto failed for $PR_URL"

          # Same readback as the other two paths — `gh pr merge --auto` can
          # report success while queueing nothing.
          verdict=$(gh pr view "$PR_URL" --json autoMergeRequest,state \
            --jq 'if .state == "MERGED" or .autoMergeRequest != null then "ok" else "not-queued" end')
          if [ "$verdict" != "ok" ]; then
            echo "::error::auto-merge was NOT queued on $PR_URL (autoMergeRequest null and state is not MERGED)"
            exit 1
          fi
          echo "auto-merge queued (or already merged) on $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Report the decision (never conclude green having done nothing)
        # The original failure mode was silence: when both enable steps were
        # skipped, zero steps ran and the job still reported SUCCESS, so a PR
        # that never got queued looked indistinguishable from one that did.
        # Skipping can be legitimate (a bundler major SHOULD wait for a human),
        # so this warns and records the reason rather than failing the job.
        if: always()
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPENDABOT_OUTCOME: ${{ steps.dependabot_enable.outcome }}
          ENGINE_OUTCOME: ${{ steps.engine_enable.outcome }}
          MAINTAINER_OUTCOME: ${{ steps.maintainer_enable.outcome }}
          REVIEW_VERDICT: ${{ steps.maintainer_review_gate.outputs.verdict }}
          REVIEW_DETAIL: ${{ steps.maintainer_review_gate.outputs.detail }}
          MERGE_TOKEN_MODE: ${{ steps.token.outputs.mode }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo "### Auto-lander decision"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| PR | $PR_URL |"
            echo "| actor | ${{ github.actor }} |"
            echo "| ecosystem | ${ECOSYSTEM:-—} |"
            echo "| dependency-group | ${DEP_GROUP:-none (ungrouped)} |"
            echo "| update-type | ${UPDATE_TYPE:-—} |"
            echo "| dependabot step | ${DEPENDABOT_OUTCOME} |"
            echo "| engine step | ${ENGINE_OUTCOME} |"
            echo "| maintainer step | ${MAINTAINER_OUTCOME} |"
            echo "| maintainer review gate | ${REVIEW_VERDICT:-n/a} — ${REVIEW_DETAIL:-—} |"
            echo "| merge token | ${MERGE_TOKEN_MODE:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # A maintainer PR held by the review gate is a DISTINCT outcome from
          # "the gate didn't match anything", and must not be reported as the
          # generic nothing-was-enabled case below — that message tells you to
          # widen the gate, which is the opposite of what happened here.
          if [ "$REVIEW_VERDICT" = "failed" ] || [ "$REVIEW_VERDICT" = "unknown" ]; then
            echo "::warning::auto-lander held $PR_URL — review gate verdict '${REVIEW_VERDICT}': ${REVIEW_DETAIL}. Merge by hand once the review has concluded."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🛑 **Held by the review gate (${REVIEW_VERDICT}).** This PR will not land on its own until a review has concluded cleanly — merge it by hand if you are satisfied without one." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DEPENDABOT_OUTCOME" = "skipped" ] && [ "$ENGINE_OUTCOME" = "skipped" ] && [ "$MAINTAINER_OUTCOME" = "skipped" ]; then
            echo "::warning::auto-lander enabled nothing on $PR_URL — update-type=${UPDATE_TYPE:-none} group=${DEP_GROUP:-none} ecosystem=${ECOSYSTEM:-none}. If this bump should land automatically, the gate needs widening; if it is a major, it is correctly waiting for a human."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **Nothing was enabled** — this PR will not land on its own." >> "$GITHUB_STEP_SUMMARY"
          fi
