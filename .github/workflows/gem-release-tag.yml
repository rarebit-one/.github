name: Gem release tag

# Tags a merged release PR so approving a release is one click.
#
# Each gem's release.yml fires on `push: tags: v*`. Before this workflow, that
# tag was pushed by hand (the last manual step of /publish-gem), so merging a
# release PR left the release half-done and easy to forget. This closes that gap:
# merge the PR -> the tag appears -> release.yml builds, creates the GitHub
# Release, and publishes to RubyGems via the trusted publisher.
#
# WHY POLLING, not a per-repo `pull_request: closed` trigger: tagging on merge
# needs an event inside each gem repo, which would mean adding and maintaining a
# caller workflow in nine repos. Polling keeps the whole mechanism in one place,
# and self-heals — a tag missed because of a transient failure is created on the
# next pass, whereas a missed event is gone. The cost is up to an hour of latency
# on a publish, which is not a latency-sensitive operation.
#
# WHY A WINDOW, not just the tip of main: the release PR is often not the last
# thing to merge before the next hourly pass. When an unrelated PR (an estate
# sync, a Dependabot bump) lands minutes after a release PR, the tip is no longer
# the release commit, and a tip-only check skips the release for good. So each
# pass reads the last WINDOW commits on main and picks the most recent
# `chore: Release vX.Y.Z` subject, then tags THAT commit's SHA, not the tip.
# Safety rules for the window:
#   - Only the MOST RECENT release subject counts. An older release further back
#     is superseded and is never tagged late, even if it was never tagged.
#   - If that most recent release is already tagged, the repo is done.
#   - If a later commit in the window reverts it ("Revert "chore: Release
#     vX.Y.Z...""), it is not tagged.
#   - The version guard reads lib/**/version.rb from the release commit's own
#     tree, not the tip's.
# WINDOW only has to cover what merges in the hour between passes.
#
# The tag is created with the release-bot App token, NOT GITHUB_TOKEN: pushes made
# with GITHUB_TOKEN deliberately do not trigger further workflows, which would
# leave the tag sitting there with release.yml never firing. App installation
# tokens do trigger them.

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off the hour to dodge cron congestion
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Report what would be tagged without creating tags.'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: gem-release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag merged releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint app token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: rarebit-one
          permission-contents: write
          permission-metadata: read

      - name: Tag any merged release commits
        id: tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
          SKIP: 'ground_control-api ground_control-inertia rarebit-static-v2 ktor-armour'
          WINDOW: '10'   # commits on main to look back over (see the header)
        run: |
          set -euo pipefail
          tagged=''
          for repo in $(gh repo list rarebit-one --limit 100 --json name,isArchived \
                          --jq '.[]|select(.isArchived|not)|.name' | sort); do
            case " $SKIP " in *" $repo "*) continue ;; esac
            # Capture, then match. Never pipe gh into `grep -q` under pipefail: grep
            # exits on its first match, gh dies of SIGPIPE (141) mid-write, and the
            # pipeline reads as "no match" — this is what made the guard below
            # report "no version.rb in tree" for standard_id v0.63.0.
            names=$(gh api "repos/rarebit-one/$repo/contents" --jq '.[].name' 2>/dev/null) || continue
            grep -q '\.gemspec$' <<<"$names" || continue

            # The last WINDOW commits on main, newest first, as "sha subject"
            # (squash-merged, so a release PR's subject is its title).
            commits=$(gh api "repos/rarebit-one/$repo/commits?per_page=$WINDOW" \
              --jq '.[] | "\(.sha) \(.commit.message | split("\n")[0])"' 2>/dev/null) || continue

            # The most recent release subject in the window, and only that one: an
            # older release behind it is superseded and must never be tagged late.
            # The match is deliberately loose ("chore: Release v" + anything), so a
            # malformed newer release subject still shadows an older valid one and
            # the semver check below skips the repo rather than reaching back.
            release=$(grep -m1 -E '^[0-9a-f]{40} chore: Release v' <<<"$commits" || true)
            [ -n "$release" ] || continue
            read -r sha subject <<<"$release"

            # Capture ONLY the semver. A squash merge appends the PR number to the
            # subject ("chore: Release v0.2.0 (#29)"), so a trailing `.*` inside the
            # capture group swallows it and yields the tag "v0.2.0 (#29)" — which no
            # existence check would ever match, re-tagging an already-published gem
            # on every pass.
            version=$(sed -nE 's/^chore: Release v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?).*$/\1/p' <<<"$subject")
            [ -n "$version" ] || continue

            if gh api "repos/rarebit-one/$repo/git/ref/tags/v$version" >/dev/null 2>&1; then
              continue   # already tagged — normal on every pass after the first
            fi

            # A newer commit in the window that reverts this release means it was
            # backed out; the revert's subject quotes the release subject.
            newer=$(sed -n "/^$sha /q;p" <<<"$commits")
            if grep -qF "Revert \"chore: Release v$version" <<<"$newer"; then
              echo "::warning::$repo: v$version was reverted on main — not tagging"
              continue
            fi

            # Guard: the commit must actually carry this version. Protects against
            # tagging a revert, or a hand-written commit that merely borrows the
            # subject line.
            # The tree is fetched once and matched as a string (see the SIGPIPE note
            # above).
            paths=$(gh api "repos/rarebit-one/$repo/git/trees/$sha?recursive=1" \
                      --jq '.tree[].path' 2>/dev/null || true)
            vfile=$(grep -m1 -E 'lib/.*version\.rb$' <<<"$paths" || true)
            if [ -z "$vfile" ]; then
              echo "::warning::$repo: no version.rb in tree — not tagging"
              continue
            fi
            actual=$(gh api "repos/rarebit-one/$repo/contents/$vfile?ref=$sha" --jq '.content' \
                      | base64 -d | sed -nE 's/.*VERSION[[:space:]]*=[[:space:]]*["'"'"']([^"'"'"']+)["'"'"'].*/\1/p' | head -1)
            if [ "$actual" != "$version" ]; then
              echo "::warning::$repo: subject says v$version but $vfile says $actual — not tagging"
              continue
            fi

            echo "$repo: tagging v$version at ${sha:0:8}$( [ "$sha" = "${commits%% *}" ] || echo " (not the tip of main)")"
            if [ "$DRY_RUN" = "true" ]; then
              tagged="$tagged\n• $repo v$version (dry-run)"
              continue
            fi
            if gh api --method POST "repos/rarebit-one/$repo/git/refs" \
                 -f ref="refs/tags/v$version" -f sha="$sha" >/dev/null; then
              tagged="$tagged\n• $repo v$version"
            else
              echo "::warning::$repo: failed to create tag v$version"
            fi
          done
          if [ -n "$tagged" ]; then
            { echo 'tagged<<EOF'; printf '%b\n' "$tagged"; echo EOF; } >> "$GITHUB_OUTPUT"
          fi
          printf 'result:%b\n' "${tagged:-\n(nothing to tag)}"

      - name: Record tags in run summary
        if: ${{ steps.tag.outputs.tagged != '' }}
        env:
          TAGGED: ${{ steps.tag.outputs.tagged }}
        run: |
          set -euo pipefail
          { echo "### Gem release tagged (publishing via each gem's release.yml)"; echo; printf '%s\n' "$TAGGED"; } >> "$GITHUB_STEP_SUMMARY"

  alert:
    needs: [tag]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Runaway-hang cap. A single gh issue list/create/close notify step; finishes in
    # seconds. 5 replaces the implicit 360-min (6h) default.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Flag failure or clear on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout, so pin the repo for gh
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          SUCCEEDED: ${{ contains(needs.*.result, 'success') }}
        run: |
          set -euo pipefail
          WF="gem-release-tag"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # NB: this repo has ISSUES DISABLED, so every `gh issue` call here errors. The
          # issue bookkeeping is therefore BEST-EFFORT (guarded with `|| true`) — otherwise
          # `set -e` aborts this step on the very first `gh issue list` and a GREEN run
          # shows red. On a real failure we still emit a ::warning:: so it is visible in
          # the run; the tracking issue starts working if/when issues are re-enabled.
          EXISTING="$(gh issue list --search "\"beat failure: ${WF}\" in:title" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ "${FAILED}" != "true" ]; then
            # Nothing failed. Close any open failure issue only on a run that ACTUALLY
            # succeeded — an all-skipped run is not evidence of recovery.
            if [ "${SUCCEEDED}" = "true" ] && [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Recovered: ${WF} succeeded — ${RUN_URL}." 2>/dev/null || true
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: ${RUN_URL}" 2>/dev/null || true
          else
            gh issue create \
              --title "beat failure: ${WF} ($(date -u +%F))" \
              --body "The \`${WF}\` beat failed before it could report — see ${RUN_URL}" \
              2>/dev/null \
              || echo "::warning::${WF} FAILED and issues are unavailable on this repo — see ${RUN_URL}"
          fi
