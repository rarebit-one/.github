name: license-check-self

# Exercises the license-check reusable end to end on its own PRs: the workflow file
# and checker from the PR head, scanning the test fixtures with live registry lookups.
# Report mode, so the fixtures' deliberately blocked entries never turn the PR red.

on:
  pull_request:
    paths:
      - .github/workflows/license-check.yml
      - .github/workflows/license-check-self.yml
      - .github/scripts/license-check.py
      - .github/scripts/license-policy.json
      - tests/license-check.test.py
      - tests/fixtures/license-check/**

permissions:
  contents: read

jobs:
  license-check:
    uses: ./.github/workflows/license-check.yml
    with:
      path: tests/fixtures/license-check
      tool_ref: ${{ github.event.pull_request.head.sha }}
