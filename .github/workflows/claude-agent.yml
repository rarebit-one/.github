name: Claude Code Agent

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          Label of the runner to execute on. Defaults to ubuntu-latest, which is
          REQUIRED for public callers: the estate's self-hosted runner groups
          carry `allows_public_repositories: false`, so a public repo pointed at
          one has its job refused and it queues forever with nothing red. Private
          callers pass their homelab label (e.g. `hyperion`).
        type: string
        default: 'ubuntu-latest'

env:
  # Single source of truth for the Claude model across this repo's Claude
  # workflows. Override org-wide via the CLAUDE_MODEL Actions variable; the
  # literal is a safe fallback so an unset var can't yield an empty --model.
  CLAUDE_MODEL: "${{ vars.CLAUDE_MODEL || 'claude-opus-4-8' }}"

jobs:
  claude:
    name: Claude Code Agent
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@e63208cb983318a44e3f945e959ef894b707dcfa # v1.0.192
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Pin the model so the interactive agent doesn't silently shift when
          # the action's default changes. Keep in lockstep with claude-code-review.yml.
          # --effort high: this is a coding/correctness lane (issue-triggered PR
          # agent), so it hardcodes the high tier rather than reading the
          # CLAUDE_EFFORT estate floor.
          claude_args: '--model ${{ env.CLAUDE_MODEL }} --effort high'
