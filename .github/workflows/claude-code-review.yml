name: Claude Code Review

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          Label of the runner to execute on. Defaults to ubuntu-latest, which is
          REQUIRED for public callers: the estate's self-hosted runner groups
          carry `allows_public_repositories: false`, so a public repo pointed at
          one has its job refused and it queues forever with nothing red. Private
          callers pass their homelab label (e.g. `hyperion`).
        type: string
        default: 'ubuntu-latest'

env:
  # Single source of truth for the Claude model across this repo's Claude
  # workflows. Override org-wide via the CLAUDE_MODEL Actions variable; the
  # literal is a safe fallback so an unset var can't yield an empty --model.
  CLAUDE_MODEL: "${{ vars.CLAUDE_MODEL || 'claude-opus-4-8' }}"
  # CLAUDE_TOOL_ARGS and REVIEW_PROMPT are both hoisted for one reason: the
  # review step below runs up to three times (see the retry block), Actions has
  # no YAML anchors, and three copies of either is three chances for them to
  # drift apart. For the tool list that drift would be a silent widening of the
  # reviewer's permissions — it is read-only by design (no Edit, no mutating
  # Bash) so the workflow stays fork-safe against prompt injection from
  # untrusted PR content.
  #
  # 🔴 CLAUDE_TOOL_ARGS holds NO `--model`, deliberately. A workflow-level
  # `env:` entry cannot read the `env` context, so writing
  # `--model ${{ env.CLAUDE_MODEL }}` HERE would expand to an empty string and
  # every review would run on the action's default model, silently. The step's
  # `with:` CAN read `env`, so the two are composed there and CLAUDE_MODEL above
  # stays the single source of truth.
  CLAUDE_TOOL_ARGS: '--allowed-tools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)" --effort high'
  REVIEW_PROMPT: |
    REPO: ${{ github.repository }}
    PR NUMBER: ${{ github.event.pull_request.number }}

    Please review this pull request and provide feedback on:
    - Code quality and best practices
    - Potential bugs or issues
    - Performance considerations
    - Security concerns
    - Test coverage

    Use the repository's CLAUDE.md for guidance on style and conventions.
    Be constructive and helpful in your feedback.

    Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

jobs:
  claude_review:
    name: Claude Code Review
    # NOTE: deliberately NOT gating the JOB on dependabot here. A skipped
    # job reports its required status context as skipped/neutral, which
    # GitHub treats as not-satisfied -> the required "Claude Code Review"
    # check stays forever-pending and auto-merge hangs. Instead the job
    # RUNS for dependabot PRs and the review STEPS are step-gated below, so
    # the job completes green without spending LLM budget on a version bump.
    if: github.event.pull_request.draft == false
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 30

    steps:
      # Secrets aren't allowed in `if:` expressions, so route through env and
      # short-circuit downstream steps when the token is missing. Lets the
      # workflow run on repos / forks that haven't (yet) been wired up with
      # the CLAUDE_CODE_OAUTH_TOKEN secret without producing a hard failure.
      - name: Check for Claude OAuth token
        id: token-check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret is not configured; skipping Claude review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # ── Transient-failure retry (rarebit-sre#167) ───────────────────────────
      #
      # claude-code-action intermittently returns `is_error:true` on the FIRST
      # turn with `total_cost_usd: 0` and a sub-second duration — an upstream
      # capacity rejection, not a bad credential and not a review verdict. With
      # no retry, one such blip permanently reds the check.
      #
      # Measured 2026-08-21: four consecutive PRs failed this way between 15:34
      # and 15:56 UTC; re-running one unchanged at 16:05 passed with
      # `is_error:false`, 13 turns and $0.497 spent. Same commit, same secret.
      #
      # A failed attempt costs ~700ms and $0, so retrying is close to free.
      #
      # 🔴 SCOPE: this absorbs SHORT blips, not a long outage. The backoffs
      # below span ~6 minutes; the 2026-08-21 window was ~30 minutes wide, so
      # this alone would NOT have saved every PR that day. Read that before
      # making this check `required` anywhere (rarebit-sre#201) — gating on it
      # without a much longer wait converts an upstream blip into a hard block
      # across every auto-landing repo.
      - name: Mark attempt start
        id: t_1
        if: steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: review_1
        if: steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: true
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1 # v1.0.208
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          allowed_bots: '*'
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: '--model ${{ env.CLAUDE_MODEL }} ${{ env.CLAUDE_TOOL_ARGS }}'

      # Retry only a CHEAP failure. The transient rejection this exists for dies
      # in under a second having spent $0; a failure DEEP into a real review has
      # already burned turns and dollars, and retrying it twice more would
      # triple that spend and can approach the job's 30-minute timeout on a
      # large PR. Elapsed wall-clock separates the two without depending on the
      # action's internal output file, whose path is an implementation detail.
      - name: Is attempt 1 cheaply retryable?
        id: retryable_1
        if: steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.review_1.outcome == 'failure'
        env:
          STARTED_AT: ${{ steps.t_1.outputs.ts }}
        run: |
          elapsed=$(( $(date +%s) - STARTED_AT ))
          if [ "$elapsed" -lt 120 ]; then
            echo "Attempt 1 failed after ${elapsed}s — cheap, retrying."
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Attempt 1 failed after ${elapsed}s — too expensive to be the known transient blip; not retrying."
            echo "retry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Back off before first retry
        if: steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.review_1.outcome == 'failure' && steps.retryable_1.outputs.retry == 'true'
        run: sleep 60

      - name: Mark attempt start
        id: t_2
        if: steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.review_1.outcome == 'failure' && steps.retryable_1.outputs.retry == 'true'
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review (retry 1)
        id: review_2
        if: steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.review_1.outcome == 'failure' && steps.retryable_1.outputs.retry == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1 # v1.0.208
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          allowed_bots: '*'
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: '--model ${{ env.CLAUDE_MODEL }} ${{ env.CLAUDE_TOOL_ARGS }}'

      # Retry only a CHEAP failure. The transient rejection this exists for dies
      # in under a second having spent $0; a failure DEEP into a real review has
      # already burned turns and dollars, and retrying it twice more would
      # triple that spend and can approach the job's 30-minute timeout on a
      # large PR. Elapsed wall-clock separates the two without depending on the
      # action's internal output file, whose path is an implementation detail.
      - name: Is attempt 2 cheaply retryable?
        id: retryable_2
        if: steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.review_1.outcome == 'failure' && steps.review_2.outcome == 'failure' && steps.retryable_1.outputs.retry == 'true'
        env:
          STARTED_AT: ${{ steps.t_2.outputs.ts }}
        run: |
          elapsed=$(( $(date +%s) - STARTED_AT ))
          if [ "$elapsed" -lt 120 ]; then
            echo "Attempt 2 failed after ${elapsed}s — cheap, retrying."
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Attempt 2 failed after ${elapsed}s — too expensive to be the known transient blip; not retrying."
            echo "retry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Back off before final retry
        if: steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.review_1.outcome == 'failure' && steps.review_2.outcome == 'failure' && steps.retryable_1.outputs.retry == 'true' && steps.retryable_2.outputs.retry == 'true'
        run: sleep 300

      - name: Mark attempt start
        id: t_3
        if: steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.review_1.outcome == 'failure' && steps.review_2.outcome == 'failure' && steps.retryable_1.outputs.retry == 'true' && steps.retryable_2.outputs.retry == 'true'
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review (retry 2)
        id: review_3
        if: steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.review_1.outcome == 'failure' && steps.review_2.outcome == 'failure' && steps.retryable_1.outputs.retry == 'true' && steps.retryable_2.outputs.retry == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1 # v1.0.208
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          allowed_bots: '*'
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: '--model ${{ env.CLAUDE_MODEL }} ${{ env.CLAUDE_TOOL_ARGS }}'

      # 🔴 THE step that owns this job's result. Every attempt above is
      # continue-on-error, so without this the job would go GREEN whenever the
      # retry chain stops early — which it deliberately does when a failure was
      # too expensive to be the known transient blip. A skipped attempt has
      # outcome `skipped`, never `success`, so only a real success clears this.
      - name: Review verdict
        if: always() && steps.token-check.outputs.skip != 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          O1: ${{ steps.review_1.outcome }}
          O2: ${{ steps.review_2.outcome }}
          O3: ${{ steps.review_3.outcome }}
        run: |
          for o in "$O1" "$O2" "$O3"; do
            if [ "$o" = "success" ]; then
              echo "Claude Code Review succeeded (attempt outcomes: $O1 / $O2 / $O3)."
              exit 0
            fi
          done
          echo "::error::Claude Code Review did not succeed. Attempt outcomes: $O1 / $O2 / $O3."
          exit 1
