name: PR

# Pins the gate logic that decides merges, each test extracting its code
# from the workflow YAML itself so it cannot drift from what actually runs:
# the maintainer auto-merge gate (dependabot-auto-merge.yml) and
# pin-check's workflow-validity check.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Pins the gate logic that decides merges, each test extracting its code
  # from the workflow YAML itself so it cannot drift from what actually runs.
  gate-tests:
    name: Gate tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pins classify_review_runs (dependabot-auto-merge.yml).
      - run: bash tests/maintainer-review-gate.test.sh
      # Pins pin-check's workflow-validity check (pin-check.yml).
      - run: bash tests/pin-check-workflow-validity.test.sh
