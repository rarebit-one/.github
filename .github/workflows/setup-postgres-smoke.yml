# Proves the org-shared setup-postgres composite actually stands a root-free
# postgres up AND answers real SQL on GitHub-hosted ubuntu-latest.
#
# WHY NO jdb LEG HERE: this `.github` repo is PUBLIC, and the broker's tenant
# policy refuses public repositories on the self-hosted (home-network) fleet — a
# self-hosted runner reachable from a fork PR is the classic RCE path. So the
# broker returns `public_repository` and a jdb job could never place here. The
# jdb proof therefore lives in a PRIVATE consumer (jumpdrive-web, once
# rarebit-one/jumpdrive-web#1131 lands); the action's root-free bring-up is
# additionally verified inside the actual jumpdrive-ci-runner image on amd64 +
# arm64 (see the README).
#
# Runs only when the action or this workflow changes (paths filter) so it never
# taxes unrelated PRs, plus on-demand via workflow_dispatch. The `pg` client is
# installed per-run via npm (Node is present) precisely because zonky ships no
# psql — this asserts an app-style libpq connection works.
name: setup-postgres smoke

on:
  pull_request:
    paths:
      - ".github/actions/setup-postgres/**"
      - ".github/workflows/setup-postgres-smoke.yml"
  workflow_dispatch:

concurrency:
  group: setup-postgres-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    # 18 = the action's default and the estate CI target; 16 = the oldest major
    # a consumer here pins (jumpdrive-web migrations matrix, #1131).
    # rarebit-one/rarebit-sre#376.
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    name: smoke (pg${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stand up root-free postgres
        uses: ./.github/actions/setup-postgres
        with:
          version: ${{ matrix.postgres }}
          database: smoke_test

      - name: Real SQL round-trip over DATABASE_URL (app-style, via libpq)
        shell: bash
        run: |
          set -euo pipefail
          echo "who am i: $(id)"
          echo "DATABASE_URL=$DATABASE_URL"
          tmp="$(mktemp -d)"; cd "$tmp"
          npm init -y >/dev/null 2>&1
          npm install pg@8 >/dev/null 2>&1
          node -e '
            const { Client } = require("pg");
            (async () => {
              const c = new Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              await c.query("create table t(id int primary key, name text)");
              await c.query("insert into t values (1, $1)", ["hello-" + (process.env.RUNNER_NAME || "runner")]);
              const r = await c.query("select name from t where id = 1");
              const v = (await c.query("select version()")).rows[0].version.split(",")[0];
              console.log("REAL SQL ROUND-TRIP OK →", r.rows[0].name, "|", v);
              await c.end();
            })().catch((e) => { console.error(e); process.exit(1); });
          '

      - name: Assert version is the pinned major
        shell: bash
        env:
          EXPECTED_MAJOR: ${{ matrix.postgres }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cd "$tmp"; npm init -y >/dev/null 2>&1; npm install pg@8 >/dev/null 2>&1
          major="$(node -e '
            const { Client } = require("pg");
            (async () => {
              const c = new Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              const n = (await c.query("show server_version_num")).rows[0].server_version_num;
              console.log(Math.floor(Number(n) / 10000));
              await c.end();
            })().catch((e) => { console.error(e); process.exit(1); });
          ')"
          echo "server major = $major"
          test "$major" = "$EXPECTED_MAJOR" || { echo "::error::expected major $EXPECTED_MAJOR, got $major"; exit 1; }
