name: Deploy to DigitalOcean App Platform
description: >-
  Patch a live DO App Platform appspec to a DOCR image pinned at a given SHA,
  apply it, and poll the resulting deployment to a terminal phase. Backs the
  DOCR-image deploy model for the rarebit-one web apps (nutripod-web) — the caller builds + pushes the image to DOCR, then invokes
  this action to point the live app at that tag and wait for the rollout.
  Mirrored verbatim into fundbright/.github for fundbright-web (separate org);
  update both copies together.

  THE SPEC WRITE IS CLIENT-INDEPENDENT. The live spec is read and written over
  the DigitalOcean REST API as raw JSON (GET /v2/apps/{id} -> patch the image
  source with jq -> PUT /v2/apps/{id}), never through a CLI's spec model. An
  old doctl once dropped every spec field it did not know on that round trip
  (fundbright/delivery-ops#1019). After the PUT, the spec DO returns is compared
  with the fetched spec plus the intended patch, and ANY other difference fails
  the deploy with phase SPEC_DRIFT and the list of differing paths.

  PREREQUISITES (the caller must do these before invoking this action):
    - Pass the DO token as `do_token` (or export DIGITALOCEAN_ACCESS_TOKEN on
      the calling step or job). The spec read and write use it directly.
    - `doctl` is installed and authenticated (`doctl auth init --access-token …`),
      for the READ-ONLY deployment polling only. doctl persists auth under $HOME
      for the rest of the job, so this action's doctl calls inherit it. Keep the
      caller's doctl version guard: polling still parses its output.
    - `jq` (1.6+) and `curl` are on PATH — both preinstalled on ubuntu-latest.

  This action NEVER exits non-zero. EVERY failure path — pre-flight input
  validation, spec fetch, patch, apply, and poll — emits a `phase` sentinel +
  `outcome=failure` via the step outputs and exits 0. The caller is expected to
  (a) read the outputs from `always()` steps (post-deploy triage, status
  updates) and (b) gate the job's success on `outcome == 'success'`
  (equivalently `phase == 'ACTIVE'`) immediately after this step, before any
  success-only steps (release tag, Sentry notify). Because a failed composite
  action does not reliably propagate its outputs, keeping every path on the
  exit-0 + sentinel contract is what lets the caller always read a `phase` — the
  two steps below share the same output keys, and the action-level outputs fall
  back from `deploy` to `patch_spec` so a pre-deploy failure still surfaces.

inputs:
  app_id:
    description: DigitalOcean App Platform app ID (e.g. vars.DO_STAGING_APP_ID).
    required: true
  do_token:
    description: >-
      DigitalOcean API token with app read + update on `app_id`, used for the
      REST spec read and write. Falls back to $DIGITALOCEAN_ACCESS_TOKEN from
      the environment; with neither set the action fails with INVALID_INPUT.
    required: false
    default: ""
  image_repo:
    description: DOCR repository name to pin every component to (e.g. nutripod-web).
    required: true
  deploy_sha:
    description: Commit SHA (or tag) to set as the image tag on every component.
    required: true
  components:
    description: >-
      Optional. Comma- or newline-separated component names to patch. Empty (the
      default) patches EVERY service, worker and job, exactly as before. Set it
      when one app runs images from more than one DOCR repository (e.g. a web
      image plus a sidecar service built from a subdirectory): each promote then
      repoints and verifies only its own components and leaves the others as
      they are. A named component that is not in the live spec fails the run
      with phase MISSING_COMPONENTS before anything is applied. CALLER
      REQUIREMENT: run the promotes for one app one after another (`needs:`,
      or one shared concurrency group with cancel-in-progress false). Each is
      a get-patch-apply of the whole spec, so two interleaved runs can revert
      each other's image, and the deployment-id fallback assumes no other
      promote of the same SHA is in flight.
    required: false
    default: ""
  poll_timeout_seconds:
    description: How long to poll for a terminal phase before giving up. Matches doctl's internal --wait timeout.
    required: false
    default: "1800"
  poll_interval_seconds:
    description: Polling cadence while the deploy is in flight (seconds, must be >= 1).
    required: false
    default: "10"

outputs:
  do_deploy_id:
    description: The DigitalOcean deployment ID for this deploy (empty if the update never produced one).
    value: ${{ steps.deploy.outputs.do_deploy_id || steps.patch_spec.outputs.do_deploy_id }}
  do_deploy_url:
    description: Cloud console URL for the deployment (empty if no deploy id).
    value: ${{ steps.deploy.outputs.do_deploy_url || steps.patch_spec.outputs.do_deploy_url }}
  phase:
    description: >-
      Outcome phase. ACTIVE on success; on failure one of ERROR / CANCELED /
      SUPERSEDED (DO terminal phases), TIMEOUT (polling deadline hit before a
      terminal phase), or a sentinel: INVALID_INPUT / SPEC_FETCH_FAILED /
      PATCH_FAILED / NO_COMPONENTS / MISSING_COMPONENTS (pre-deploy) or
      UPDATE_FAILED / PARSE_FAILED / SPEC_DRIFT
      / NO_DEPLOY_ID (apply). SPEC_DRIFT means the write WAS applied but the
      spec DO now holds differs from the intended one outside the image patch;
      the log lists the paths, and do_deploy_id is set when DO started one.
    value: ${{ steps.deploy.outputs.phase || steps.patch_spec.outputs.phase }}
  outcome:
    description: "'success' when phase == ACTIVE, otherwise 'failure'. Convenience for the caller's gate step."
    value: ${{ steps.deploy.outputs.outcome || steps.patch_spec.outputs.outcome }}

runs:
  using: composite
  steps:
    - name: Fetch live appspec and patch image to DOCR + SHA
      id: patch_spec
      shell: bash
      env:
        APP_ID: ${{ inputs.app_id }}
        IMAGE_REPO: ${{ inputs.image_repo }}
        DEPLOY_SHA: ${{ inputs.deploy_sha }}
        COMPONENTS: ${{ inputs.components }}
        DO_TOKEN: ${{ inputs.do_token }}
        PATCH_JQ: ${{ github.action_path }}/patch-spec.jq
      run: |
        set -uo pipefail
        # Like the deploy step, this step NEVER exits non-zero: pre-flight and
        # patch failures emit a phase sentinel + outcome=failure and exit 0, so
        # the caller can read a `phase` even when the deploy step is skipped
        # (it's gated on this step's outcome). The action-level outputs fall
        # back to this step's outputs when `deploy` doesn't run.
        emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
        fail() {
          emit phase "$1"
          emit outcome "failure"
          emit do_deploy_id ""
          emit do_deploy_url ""
          exit 0
        }

        # `required: true` only enforces presence, not non-emptiness — an empty
        # `vars.DO_STAGING_APP_ID` would otherwise sail through to the API and
        # fail with an opaque message. Catch it up front with a clear sentinel.
        if [ -z "$APP_ID" ] || [ -z "$IMAGE_REPO" ] || [ -z "$DEPLOY_SHA" ]; then
          echo "::error::app_id, image_repo and deploy_sha must all be non-empty (got app_id='$APP_ID' image_repo='$IMAGE_REPO' deploy_sha='$DEPLOY_SHA')"
          fail "INVALID_INPUT"
        fi
        DO_TOKEN="${DO_TOKEN:-${DIGITALOCEAN_ACCESS_TOKEN:-}}"
        if [ -z "$DO_TOKEN" ]; then
          echo "::error::no DigitalOcean token: pass the do_token input (or set DIGITALOCEAN_ACCESS_TOKEN). The spec is read and written over the REST API, not through doctl."
          fail "INVALID_INPUT"
        fi

        # The spec carries env values (SECRET ones as EV[...] ciphertext), so
        # every copy lives in a private dir and is never printed.
        umask 077
        WORK="${RUNNER_TEMP:-/tmp}/do-app-deploy"
        mkdir -p "$WORK"
        rm -f "$WORK"/app-before.json "$WORK"/spec-before.json "$WORK"/spec-patched.json

        # DO is the source of truth for the appspec — env vars, instance
        # sizes, alerts, etc. are managed in the DO UI. We only patch the
        # image source: replace the `github`/`dockerfile_path` build with
        # an `image:` block pinned to this commit's SHA. Restarts and
        # instance replacements then pull the same digest CI validated.
        #
        # Read RAW over REST, not via `doctl apps spec get`: a client decodes
        # the spec into its own model and re-encodes it, so any field it does
        # not know is silently dropped, and the write-back then deletes it from
        # the live app (fundbright/delivery-ops#1019). Raw JSON in, raw JSON out.
        # The token goes to curl on stdin (-K -), never on argv.
        CODE=$(printf 'header = "Authorization: Bearer %s"\n' "$DO_TOKEN" \
          | curl -sS -K - --retry 3 --max-time 60 -o "$WORK/app-before.json" -w '%{http_code}' \
              "https://api.digitalocean.com/v2/apps/${APP_ID}" 2>"$WORK/get.err") || true
        if [ "${CODE:-000}" != "200" ]; then
          echo "::error::GET /v2/apps/$APP_ID failed (HTTP ${CODE:-000}): $(jq -r '.message // empty' "$WORK/app-before.json" 2>/dev/null)$(cat "$WORK/get.err" 2>/dev/null)"
          fail "SPEC_FETCH_FAILED"
        fi
        if ! jq -e '.app.spec | type == "object"' "$WORK/app-before.json" >/dev/null 2>&1 \
           || ! jq '.app.spec' "$WORK/app-before.json" > "$WORK/spec-before.json"; then
          echo "::error::GET /v2/apps/$APP_ID returned no .app.spec object"
          fail "SPEC_FETCH_FAILED"
        fi

        # Optional component filter (`components` input). NAMES_JSON is a JSON
        # array of names; `[]` means "every component", which is the
        # pre-existing behaviour and the default.
        NAMES_JSON=$(printf '%s' "$COMPONENTS" | tr ',' '\n' \
          | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' | jq -R . | jq -sc 'unique')
        [ -n "$NAMES_JSON" ] || NAMES_JSON='[]'
        # A value that is set but names nothing (e.g. "," or only blanks) is a
        # caller mistake, and treating it as "every component" is exactly the
        # multi-image breakage this input prevents. Fail it instead. (An unset
        # or empty value still means every component: that is the default.)
        if [ "$NAMES_JSON" = "[]" ] && [ -n "$COMPONENTS" ]; then
          echo "::error::'components' is set but names no component (got '$COMPONENTS')"
          fail "INVALID_INPUT"
        fi
        # Handed to the deploy step, so the name list is parsed in one place.
        emit names_json "$NAMES_JSON"
        if [ "$NAMES_JSON" != "[]" ]; then
          MISSING=$(jq -r --argjson want "$NAMES_JSON" \
            '($want - [(.services // [])[], (.workers // [])[], (.jobs // [])[] | .name]) | join(",")' \
            "$WORK/spec-before.json" 2>/dev/null) || MISSING="(could not read component names)"
          if [ -n "$MISSING" ]; then
            echo "::error::components named in the 'components' input are not in the live spec for $APP_ID: $MISSING"
            fail "MISSING_COMPONENTS"
          fi
          echo "Patching only the named components: $(echo "$NAMES_JSON" | jq -r 'join(", ")')"
        fi

        # The patch lives in patch-spec.jq (pinned by
        # tests/do-app-deploy-spec.test.sh). It walks services, workers and
        # jobs, leaves absent arrays absent, and matches names EXACTLY, so
        # `agent` never repoints `agent-service`. Its output is the exact PUT
        # body's spec, and the drift check's expected value.
        if ! jq --argjson names "$NAMES_JSON" --arg repo "$IMAGE_REPO" --arg sha "$DEPLOY_SHA" \
             -f "$PATCH_JQ" "$WORK/spec-before.json" > "$WORK/spec-patched.json" 2>"$WORK/patch.err"; then
          echo "::error::jq patch failed: $(cat "$WORK/patch.err" 2>/dev/null || echo 'stderr unavailable')"
          fail "PATCH_FAILED"
        fi

        # A wrong app_id can resolve to a component-less app: the patch above
        # would then be a silent no-op and we'd deploy an unmodified spec.
        # Require at least one component to have been patched.
        SELECT='[(.services // [])[], (.workers // [])[], (.jobs // [])[]]
          | map(select(($names | length) == 0 or (.name as $n | any($names[]; . == $n))))'
        PATCHED=$(jq -r --argjson names "$NAMES_JSON" "$SELECT | length" "$WORK/spec-patched.json" 2>/dev/null)
        [[ "$PATCHED" =~ ^[0-9]+$ ]] || PATCHED=0
        if [ "$PATCHED" -eq 0 ]; then
          echo "::error::appspec for $APP_ID has no services/workers/jobs to patch — wrong app_id?"
          fail "NO_COMPONENTS"
        fi

        # Verify every component now points at the expected DOCR repo + tag —
        # not just the tag, so a stale/partial image block (wrong repository,
        # or a non-DOCR registry_type) is also caught.
        UNEXPECTED=$(jq -r --argjson names "$NAMES_JSON" --arg repo "$IMAGE_REPO" --arg sha "$DEPLOY_SHA" "$SELECT
          | map(select(.image.registry_type != \"DOCR\" or .image.repository != \$repo or .image.tag != \$sha) | .name)
          | join(\",\")" "$WORK/spec-patched.json" 2>/dev/null) || UNEXPECTED="(could not verify the patched spec)"
        if [ -n "$UNEXPECTED" ]; then
          echo "::error::Components not patched to DOCR/$IMAGE_REPO:$DEPLOY_SHA: $UNEXPECTED"
          fail "PATCH_FAILED"
        fi
        echo "Patched $PATCHED component(s) to DOCR/$IMAGE_REPO:$DEPLOY_SHA"

    - name: Apply spec and wait for deploy
      id: deploy
      # Skip when pre-flight/patch already failed — its sentinel is surfaced via
      # the action-level output fallback, so the caller still reads a `phase`.
      # Keeps the whole action on one uniform exit-0 + sentinel contract.
      if: ${{ steps.patch_spec.outputs.outcome != 'failure' }}
      shell: bash
      env:
        APP_ID: ${{ inputs.app_id }}
        POLL_TIMEOUT: ${{ inputs.poll_timeout_seconds }}
        POLL_INTERVAL: ${{ inputs.poll_interval_seconds }}
        # Consumed by the identity fallback below, when `apps update` omits
        # in_progress_deployment.id.
        #
        # 🔴 env does NOT cross step boundaries. These are also on the
        # `patch_spec` step, and referencing them here without exporting them
        # here aborts this step outright, because it runs under `set -u`:
        #   line 124: IMAGE_REPO: unbound variable
        # That is exactly how the fallback shipped broken in #100 — and note
        # `bash -n` does NOT catch an unbound variable, only a syntax error, so
        # the pre-merge check passed. The failure also lands BEFORE the sentinel
        # assignments, so this step breaks its own "never exit non-zero" contract
        # and the caller gets an empty phase instead of a diagnosable one.
        IMAGE_REPO: ${{ inputs.image_repo }}
        DEPLOY_SHA: ${{ inputs.deploy_sha }}
        # The parsed `components` list from patch_spec (a JSON array; `[]` = all).
        NAMES_JSON: ${{ steps.patch_spec.outputs.names_json }}
        # The REST write. patch_spec already proved one of these is non-empty.
        DO_TOKEN: ${{ inputs.do_token }}
        DRIFT_JQ: ${{ github.action_path }}/spec-drift.jq
      run: |
        set -uo pipefail
        # This step NEVER exits non-zero (see the action description): it
        # records the outcome via outputs and lets the caller gate on it.
        # All commands that may exit non-zero are guarded with `||` patterns.

        emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
        fail() {
          # phase sentinel only; no deploy id captured. Caller gate fails the job.
          emit phase "$1"
          emit do_deploy_id ""
          emit do_deploy_url ""
          emit outcome "failure"
          exit 0
        }

        # Validate the numeric inputs before they reach arithmetic context.
        # Under `set -e` a non-numeric value (e.g. "30m" or "") would make
        # `$(( … + POLL_TIMEOUT ))` abort the step with an opaque message;
        # fail fast with a clear sentinel instead so the caller's gate sees it.
        if ! [[ "$POLL_TIMEOUT" =~ ^[0-9]+$ ]] || ! [[ "$POLL_INTERVAL" =~ ^[0-9]+$ ]]; then
          echo "::error::poll_timeout_seconds / poll_interval_seconds must be integer seconds (got '$POLL_TIMEOUT' / '$POLL_INTERVAL')"
          fail "INVALID_INPUT"
        fi
        # interval 0 would turn the poll into a sleep-0 busy-loop hammering the
        # DO API; a timeout below the interval would never poll at all.
        if [ "$POLL_INTERVAL" -lt 1 ] || [ "$POLL_TIMEOUT" -lt "$POLL_INTERVAL" ]; then
          echo "::error::need poll_interval_seconds >= 1 and poll_timeout_seconds >= poll_interval_seconds (got interval=$POLL_INTERVAL timeout=$POLL_TIMEOUT)"
          fail "INVALID_INPUT"
        fi

        DO_TOKEN="${DO_TOKEN:-${DIGITALOCEAN_ACCESS_TOKEN:-}}"
        umask 077
        WORK="${RUNNER_TEMP:-/tmp}/do-app-deploy"
        # A job may run this action more than once (one promote per image with
        # `components`): never let a previous run's files answer for this one.
        rm -f "$WORK"/put-body.json "$WORK"/update.json* "$WORK"/app-after.json* \
              "$WORK"/spec-after.json "$WORK"/drift.txt "$WORK"/drift.err
        # Token on stdin (-K -), never argv. Prints the HTTP code ("000" when
        # curl itself failed). GET retries; the PUT never does, since a blind
        # retry could start a second deployment.
        do_api() { # do_api <METHOD> <path> <outfile> [<json body file>]
          local code body=()
          [ -n "${4:-}" ] && body=(-H 'Content-Type: application/json' --data-binary "@$4")
          [ "$1" = "GET" ] && body+=(--retry 3)
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$DO_TOKEN" \
            | curl -sS -K - -X "$1" --max-time 120 "${body[@]}" -o "$3" -w '%{http_code}' \
                "https://api.digitalocean.com/v2$2" 2>"$3.err") || true
          echo "${code:-000}"
        }

        # ─── Phase 1: kick off the deploy and CAPTURE THE ID ─────────
        #
        # We deliberately do NOT block on the deploy inside the write (the
        # old `doctl apps update --wait`). That form blocks for the full
        # deploy lifecycle, then we had to guess which deployment was ours
        # from `apps get` — which on a failed deploy returns the rollback
        # (DO promotes the rollback into `in_progress_deployment`
        # immediately when our deploy fails, before `--wait` even returns).
        #
        # Instead: PUT the spec and return. The response carries the
        # freshly-created `in_progress_deployment` — that's OUR deployment,
        # captured at the source. From here on, we hold the exact ID for the
        # rest of the flow regardless of any rollback DO does in the
        # background.
        #
        # The write is a raw REST PUT of the JSON patch_spec produced, so no
        # client's spec model sits between the fetched spec and the stored
        # one (fundbright/delivery-ops#1019).
        # Anchor for the identity fallback below. MUST be read BEFORE the update
        # is sent: it is the lower bound that makes "created since our request"
        # meaningful, and a timestamp taken afterwards could exclude our own
        # deployment. One second of slack absorbs clock skew between this runner
        # and DO's API — erring toward including our deployment, since the image
        # match is what actually discriminates.
        UPDATE_SENT_AT=$(date -u -d '1 second ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
          || date -u -v-1S +%Y-%m-%dT%H:%M:%SZ)
        echo "Update sent at (anchor for id resolution): $UPDATE_SENT_AT"

        if ! jq -n --slurpfile s "$WORK/spec-patched.json" '{spec: $s[0]}' > "$WORK/put-body.json" 2>/dev/null; then
          echo "::error::could not build the PUT body from the patched spec"
          fail "UPDATE_FAILED"
        fi
        CODE=$(do_api PUT "/apps/${APP_ID}" "$WORK/update.json" "$WORK/put-body.json")
        case "$CODE" in
          2??) ;;
          *)
            # DO's error envelope is {id, message, request_id}: no spec in it,
            # so it is safe to print in full.
            echo "::error::PUT /v2/apps/$APP_ID failed (HTTP $CODE): $(jq -r '.message // empty' "$WORK/update.json" 2>/dev/null)$(cat "$WORK/update.json.err" 2>/dev/null)"
            echo "::group::PUT /v2/apps response"
            jq -c '{id, message, request_id}' "$WORK/update.json" 2>/dev/null || true
            echo "::endgroup::"
            fail "UPDATE_FAILED"
            ;;
        esac
        if ! jq -e '.app | type == "object"' "$WORK/update.json" >/dev/null 2>&1; then
          echo "::error::PUT /v2/apps/$APP_ID returned no parseable app JSON"
          cat "$WORK/update.json.err" 2>/dev/null || true
          fail "PARSE_FAILED"
        fi
        UPDATE_JSON=$(cat "$WORK/update.json")

        # ─── Drift check: DO must now hold EXACTLY what we wrote ─────
        #
        # Expected = the spec fetched before the write + the image patch,
        # i.e. the PUT body. Actual = the spec in the PUT response (a fresh
        # GET if the response lacks one). spec-drift.jq lists every path that
        # differs — missing, added or changed — without printing values. Its
        # header documents the single normalisation it applies (null == absent)
        # and the measurement behind it. Pinned by
        # tests/do-app-deploy-spec.test.sh, including the #1019 field set.
        #
        # A drift is reported AFTER the write by construction: the write has
        # happened and DO may be rolling it out. That is still the point —
        # the job goes red naming exactly what was lost, instead of green over
        # a silently mangled app. Not auto-reverted: a second automated write
        # on an app in an unexpected state is not safer than a human.
        if ! jq -e '.app.spec | type == "object"' "$WORK/update.json" >/dev/null 2>&1 \
           || ! jq '.app.spec' "$WORK/update.json" > "$WORK/spec-after.json" 2>/dev/null; then
          echo "PUT response has no .app.spec; reading the spec back with a fresh GET."
          CODE=$(do_api GET "/apps/${APP_ID}" "$WORK/app-after.json")
          if [ "$CODE" != "200" ] || ! jq -e '.app.spec | type == "object"' "$WORK/app-after.json" >/dev/null 2>&1 \
             || ! jq '.app.spec' "$WORK/app-after.json" > "$WORK/spec-after.json" 2>/dev/null; then
            echo "SPEC_READBACK_FAILED (HTTP $CODE)" > "$WORK/drift.txt"
          fi
        fi
        if [ ! -s "$WORK/drift.txt" ]; then
          jq -n -r --slurpfile want "$WORK/spec-patched.json" --slurpfile got "$WORK/spec-after.json" \
            -f "$DRIFT_JQ" > "$WORK/drift.txt" 2>"$WORK/drift.err" \
            || echo "DRIFT_CHECK_ERROR $(cat "$WORK/drift.err" 2>/dev/null)" >> "$WORK/drift.txt"
        fi
        if [ -s "$WORK/drift.txt" ]; then
          DRIFT_ID=$(jq -r '.app.in_progress_deployment.id // ""' "$WORK/update.json" 2>/dev/null || true)
          echo "::error::SPEC DRIFT on app $APP_ID: after the write, the spec DigitalOcean holds differs from the fetched spec + image patch at $(wc -l < "$WORK/drift.txt" | tr -d ' ') path(s) OUTSIDE the intended change. Paths: $(paste -sd ';' "$WORK/drift.txt")"
          echo "::group::Differing paths (KIND path; values deliberately not printed)"
          cat "$WORK/drift.txt"
          echo "::endgroup::"
          echo "The write WAS applied${DRIFT_ID:+ and deployment $DRIFT_ID is rolling out}. Restore the listed settings from the previous deployment's spec (DO console → Activity, or GET /v2/apps/$APP_ID/deployments), then re-run."
          emit phase "SPEC_DRIFT"
          emit outcome "failure"
          emit do_deploy_id "$DRIFT_ID"
          emit do_deploy_url "${DRIFT_ID:+https://cloud.digitalocean.com/apps/${APP_ID}/deployments/${DRIFT_ID}}"
          exit 0
        fi
        echo "Drift check passed: the spec DigitalOcean holds equals the fetched spec + image patch (no other path differs)."

        # USUALLY the deployment is created synchronously with the spec update
        # and its id is right here in the response. That is the happy path and
        # it stays the preferred source: the id is captured before DO can do
        # anything else, so no later state can shadow it.
        DEPLOY_ID=$(echo "$UPDATE_JSON" | jq -r '.app.in_progress_deployment.id // ""')

        # …but it is NOT guaranteed. MEASURED 2026-08-11 on fundbright-web
        # staging, on this composite's first real execution: `apps update`
        # returned 200 with the updated app and `in_progress_deployment: null`,
        # while DO created deployment 3e676453 moments later and rolled it out
        # to ACTIVE perfectly. The spec patch was correct and the app was
        # healthy; only our ability to WATCH it failed. The job went red with
        # `NO_DEPLOY_ID` over a deploy that had in fact succeeded.
        #
        # A false red here is not harmless: it says "staging is broken" about a
        # healthy staging, and the documented response to a failed promotion is
        # to roll back — so the likely reaction is to revert a good deploy.
        #
        # 🔴 WHY THE OBVIOUS FALLBACK IS WRONG, and what this does instead.
        # The previous comment here refused any fallback, for a real reason
        # worth preserving: on a fast-FAILING deploy, DO promotes its automatic
        # rollback into `in_progress_deployment` within seconds. A naive
        # "refetch and take the newest/in-progress deployment" would then poll
        # the ROLLBACK to ACTIVE and report success for a deploy that failed.
        # That is strictly worse than a false red.
        #
        # So resolve by IDENTITY, never by recency alone. Our deployment is the
        # one whose spec carries the exact image we just wrote; a rollback
        # necessarily carries the PREVIOUS spec, so it cannot match. Both
        # conditions must hold:
        #   1. created_at >= the instant we sent the update (no pre-existing
        #      deployment can qualify), and
        #   2. EVERY component pinned to $IMAGE_REPO:$DEPLOY_SHA (a rollback to
        #      a different image is excluded by construction). With the
        #      `components` input set, "every" means every NAMED component: the
        #      others legitimately run other images.
        # Then take the OLDEST match — if a rollback of our own deploy somehow
        # also matched, ours was created first.
        printf '%s' "$NAMES_JSON" | jq -e 'type == "array"' >/dev/null 2>&1 || NAMES_JSON='[]'
        if [ -z "$DEPLOY_ID" ]; then
          echo "::warning::the spec PUT returned no in_progress_deployment.id — resolving the deployment by identity (see comment). This is a known DO race, not a failure."
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            LIST_JSON=$(doctl apps list-deployments "$APP_ID" --output json 2>/dev/null) || LIST_JSON='[]'
            DEPLOY_ID=$(echo "$LIST_JSON" | jq -r \
              --arg since "$UPDATE_SENT_AT" --arg repo "$IMAGE_REPO" --arg sha "$DEPLOY_SHA" \
              --argjson names "$NAMES_JSON" '
              [ .[]
                | select(.created_at >= $since)
                | select(
                    ( [ (.spec.services // [])[], (.spec.workers // [])[], (.spec.jobs // [])[] ]
                      | if ($names | length) > 0 then map(select(.name as $n | $names | index($n))) else . end
                    ) as $c
                    # Filtered: the candidate must carry EVERY named component
                    # (a spec missing one is some other deployment).
                    | (if ($names | length) > 0
                       then ([$c[].name] | unique) == ($names | unique)
                       else ($c | length) > 0 end)
                      and ($c | all(.image.repository == $repo and .image.tag == $sha))
                  )
              ] | sort_by(.created_at) | first | .id // ""')
            if [ -n "$DEPLOY_ID" ]; then
              echo "Resolved deployment by identity after ${attempt} attempt(s): $DEPLOY_ID"
              break
            fi
          done
        fi

        if [ -z "$DEPLOY_ID" ]; then
          echo "::error::Could not determine the deployment id: absent from the update response, and no deployment created since ${UPDATE_SENT_AT} is pinned to ${IMAGE_REPO}:${DEPLOY_SHA}."
          echo "The spec patch itself may still have applied — CHECK THE LIVE SPEC before assuming nothing happened."
          echo "$UPDATE_JSON" | jq '.app | {id, phase: .phase, in_progress: .in_progress_deployment, active: .active_deployment}' 2>/dev/null || true
          fail "NO_DEPLOY_ID"
        fi
        echo "Started deployment: $DEPLOY_ID"

        # Emit the ID up-front so downstream consumers (post-deploy
        # triage, failure-comment step, GitHub Deployment status) have
        # it even if the polling loop below times out.
        emit do_deploy_id "$DEPLOY_ID"
        emit do_deploy_url "https://cloud.digitalocean.com/apps/${APP_ID}/deployments/${DEPLOY_ID}"

        # ─── Phase 2: poll for terminal phase ────────────────────────
        #
        # Replaces what `--wait` would do, but bound to our specific
        # deployment ID instead of "whatever's in_progress now". DO
        # phases:
        #   PENDING_BUILD → BUILDING → PENDING_DEPLOY → DEPLOYING
        #     → ACTIVE                                       (success)
        #     → ERROR / CANCELED / SUPERSEDED                (failure)
        #
        # Default 30-minute deadline matches doctl's internal `--wait`
        # timeout; 10-second cadence mirrors doctl. Outer bound is still
        # the job-level timeout.
        DEADLINE=$(( $(date +%s) + POLL_TIMEOUT ))
        PHASE="UNKNOWN"
        # Assume timeout until a terminal phase clears it. Tracking *why* the
        # loop exited (terminal phase vs deadline) is more reliable than
        # re-checking the clock afterwards: a deploy that reaches ACTIVE in
        # the last poll interval can leave `date +%s >= DEADLINE` true and
        # would otherwise emit a spurious "timed out" warning on a success.
        TIMED_OUT=1
        # Surface persistent get-deployment failures so we don't silently
        # spin for the full deadline on a wedged API / bad credentials.
        # Reset on every successful response so the warning only fires
        # for sustained outages, not isolated blips.
        UNKNOWN_COUNT=0
        while [ "$(date +%s)" -lt "$DEADLINE" ]; do
          PHASE=$(doctl apps get-deployment "$APP_ID" "$DEPLOY_ID" \
            --format Phase --no-header 2>/dev/null | tr -d '[:space:]' || echo "UNKNOWN")
          PHASE="${PHASE:-UNKNOWN}"

          # Second read path for anything the templated read couldn't produce.
          #
          # `--format Phase` renders an UNSET field as Go's `<nil>` and still
          # exits 0, so the `|| echo "UNKNOWN"` above — which only fires on a
          # NON-ZERO exit — never sees it. Observed on fundbright-web run
          # 31450984107 (2026-08-11): `<nil>` for the full 1800s on a promotion
          # that had in fact SUCCEEDED (`doctl apps get-deployment` later
          # reported that same deployment as real and completed), producing a
          # false red on a healthy deploy plus 30 minutes of wasted runner time.
          #
          # The JSON representation carries the phase under a different code
          # path, so retry there before concluding anything. fundbright pins
          # this action by SHA and ate the false red;
          # fundbright/delivery-ops#520 has the full incident.
          case "$PHASE" in
            PENDING_BUILD|BUILDING|PENDING_DEPLOY|DEPLOYING|ACTIVE|ERROR|CANCELED|SUPERSEDED) ;;
            *)
              PHASE=$(doctl apps get-deployment "$APP_ID" "$DEPLOY_ID" \
                -o json 2>/dev/null | jq -r '.[0].phase // empty' | tr -d '[:space:]' || true)
              PHASE="${PHASE:-UNKNOWN}"
              ;;
          esac

          case "$PHASE" in
            ACTIVE)
              TIMED_OUT=0
              break
              ;;
            ERROR|CANCELED|SUPERSEDED)
              TIMED_OUT=0
              break
              ;;
            PENDING_BUILD|BUILDING|PENDING_DEPLOY|DEPLOYING)
              # Still in flight. Listed EXPLICITLY rather than left to the
              # catch-all, which is the whole point of this change — see below.
              UNKNOWN_COUNT=0
              sleep "$POLL_INTERVAL"
              ;;
            *)
              # Anything that is not a phase DO documents, including a `<nil>`
              # that survived the JSON retry above.
              #
              # This being the CATCH-ALL is the fix. Previously the in-flight
              # arm was the catch-all, so an unrecognised value landed there and
              # RESET `UNKNOWN_COUNT` on every poll — the "DO API may be
              # unreachable" guard below could therefore never trip, and the
              # loop span silently to the deadline with nothing in the log
              # explaining why. The guard existed; `<nil>` simply routed around
              # it.
              #
              # A phase DO adds in future also lands here. That degrades to a
              # warning plus continued polling, never to a wrong outcome: the
              # loop still exits only on a terminal phase or the deadline,
              # exactly as before.
              UNKNOWN_COUNT=$(( UNKNOWN_COUNT + 1 ))
              if [ "$UNKNOWN_COUNT" -ge 6 ]; then
                echo "::warning::get-deployment returned an unusable phase 6 polls in a row (last seen: '${PHASE}') — DO API may be unreachable"
                UNKNOWN_COUNT=0
              fi
              sleep "$POLL_INTERVAL"
              ;;
          esac
        done

        if [ "$TIMED_OUT" -eq 1 ]; then
          # Emit an unambiguous TIMEOUT sentinel rather than whatever
          # in-flight phase (DEPLOYING / PENDING_DEPLOY / UNKNOWN) happened
          # to be last seen — so callers can detect a timeout without
          # enumerating every non-terminal state.
          echo "::warning::Deployment $DEPLOY_ID timed out after ${POLL_TIMEOUT}s (last seen phase: $PHASE)"
          PHASE="TIMEOUT"
        fi

        if [ "$PHASE" = "ACTIVE" ]; then
          emit outcome "success"
        else
          emit outcome "failure"
        fi
        emit phase "$PHASE"
        echo "Deployed $DEPLOY_ID (phase=$PHASE)"
